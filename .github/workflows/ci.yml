name: C++ Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  serial-tests:
    name: Serial C++ Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache DejaVu fonts (APT archives)
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-fonts-dejavu

      - name: Install DejaVu fonts
        run: |
          sudo rm -f /var/cache/apt/archives/lock
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core

      - name: Copy font to data/fonts
        run: |
          mkdir -p data/fonts
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf data/fonts/

      # -- compile all serial .cpp files to check for errors --

      - name: Compile serial modules
        run: |
          g++ -std=c++17 -c src/serial/preprocessing.cpp       -I include
          g++ -std=c++17 -c src/serial/cleaning.cpp            -I include
          g++ -std=c++17 -c src/serial/boundary_extraction.cpp -I include
          g++ -std=c++17 -c src/serial/component_labeling.cpp  -I include
          g++ -std=c++17 -c src/serial/contour_to_signal.cpp   -I include
          g++ -std=c++17 -c src/serial/signal_analysis.cpp     -I include
          g++ -std=c++17 -c src/serial/visualization.cpp       -I include
          g++ -std=c++17 -c src/serial/pipeline.cpp            -I include

      # -- build and run tests --

      - name: Test contour_to_signal
        run: |
          g++ -std=c++17 src/serial/tests/test_contour_to_signal.cpp \
              src/serial/contour_to_signal.cpp \
              -I include -o test_contour_to_signal
          ./test_contour_to_signal

      - name: Test cleaning
        run: |
          g++ -std=c++17 src/serial/tests/test_cleaning.cpp \
              src/serial/cleaning.cpp \
              src/serial/boundary_extraction.cpp \
              src/serial/component_labeling.cpp \
              -I include -o test_cleaning
          ./test_cleaning

      - name: Test visualization
        run: |
          g++ -std=c++17 src/serial/tests/test_visualization.cpp \
              src/serial/visualization.cpp \
              src/serial/signal_analysis.cpp \
              -I include -o test_visualization
          ./test_visualization

      - name: Build serial pipeline
        run: |
          sed -i 's/\r//' build_serial.sh
          DEBUG=0 TIMINGS=0 ./build_serial.sh

      - name: Run full serial pipeline
        run: |
          ./build/pipeline data/single.JPG data/pipeline_output
          test -f data/pipeline_output/single_overlays.png

      - name: Cleanup test executables
        if: always()
        run: rm -f test_contour_to_signal test_cleaning test_visualization *.o

  cuda-compile:
    name: CUDA Compilation Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache CUDA Toolkit (APT archives)
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-cuda-toolkit

      - name: Install CUDA Toolkit
        run: |
          sudo rm -f /var/cache/apt/archives/lock
          sudo apt-get update
          sudo apt-get install -y nvidia-cuda-toolkit

      - name: Compile preprocessing.cu
        run: nvcc -std=c++17 -c src/parallel/preprocessing.cu -I include

      - name: Compile cleaning.cu
        run: nvcc -std=c++17 -c src/parallel/cleaning.cu -I include

      - name: Compile boundary_extraction.cu
        run: nvcc -std=c++17 -c src/parallel/boundary_extraction.cu -I include

      - name: Compile component_labeling.cu
        run: nvcc -std=c++17 -c src/parallel/component_labeling.cu -I include

      - name: Compile contour_to_signal.cu
        run: nvcc -std=c++17 -c src/parallel/contour_to_signal.cu -I include

      - name: Compile signal_analysis.cu
        run: nvcc -std=c++17 -c src/parallel/signal_analysis.cu -I include

      - name: Cleanup CUDA object files
        if: always()
        run: rm -f *.o